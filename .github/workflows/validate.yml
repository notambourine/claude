name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install Claude Code CLI
        run: sfw npm install -g @anthropic-ai/claude-code

      # Schema-validates marketplace.json, plugin.json, and skill/agent/hook
      # frontmatter. Runs without --strict on purpose: this plugin ships no
      # version field by design, and --strict promotes that "no version"
      # warning to a hard error. Genuine schema errors still fail the step.
      - name: Validate plugin + marketplace schema
        run: claude plugin validate .

      # claude plugin validate does NOT check that the two description fields
      # agree -- they are allowed to differ by design. This repo keeps them in
      # sync deliberately, so guard against silent drift.
      - name: Check description parity (plugin.json <-> marketplace.json)
        run: |
          plugin_desc=$(jq -r '.description' .claude-plugin/plugin.json)
          market_desc=$(jq -r '.plugins[] | select(.name == "nt") | .description' .claude-plugin/marketplace.json)
          if [ "$plugin_desc" != "$market_desc" ]; then
            echo "::error::description drift between plugin.json and marketplace.json"
            echo "  plugin.json:      $plugin_desc"
            echo "  marketplace.json: $market_desc"
            exit 1
          fi
          echo "descriptions match: $plugin_desc"
