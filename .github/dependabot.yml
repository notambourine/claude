# Fleet convention: twice-weekly cron (Mon & Wed 09:00 America/Chicago),
# minor+patch grouped into one PR, majors individual, cooldown-gated.
version: 2
updates:
  # plugins/nt-brand/skills/system -> notambourine/brand-kit, the golden set.
  # The bump PR is the whole update: the skill directory is the submodule, so
  # moving the pin moves the bytes an install ships.
  #
  # No cooldown and a daily interval, unlike the actions block below. That one
  # waits out a supply-chain window on code from strangers. This is a repo we
  # own, and a brand correction is worth nothing sitting in a queue.
  #
  # No security-updates group either: that half runs off Dependabot alerts, and
  # gitsubmodule raises none - the graph records a commit SHA, not a version an
  # advisory can match. The group would be config that never fires.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # A groups: block defaults to applies-to: version-updates, so without this
      # second group every advisory opens its own branch.
      security:
        applies-to: security-updates
        patterns:
          - "*"
