# Fleet convention: twice-weekly cron (Mon & Wed 09:00 America/Chicago),
# minor+patch grouped into one PR, majors individual, cooldown-gated.
version: 2
updates:
  # @notambourine/brand-kit, the golden set behind the nt-brand system skill.
  #
  # Dependabot only moves the pin. The bytes an install ships live in
  # plugins/nt-brand/skills/system/, so every bump PR needs `npm run brand:sync`
  # committed on top of it or `npm run brand` fails the PR.
  #
  # No cooldown and a daily interval, unlike the actions block below. That one
  # waits out a supply-chain window on code from strangers. This is a package we
  # publish, and a brand correction is worth nothing sitting in a queue.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # A groups: block defaults to applies-to: version-updates, so without this
      # second group every advisory opens its own branch.
      security:
        applies-to: security-updates
        patterns:
          - "*"
